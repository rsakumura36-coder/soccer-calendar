<!-- ================================= -->
<!-- Header -->
<!-- ================================= -->

<header class="bg-white shadow-sm rounded-4 p-4 mb-4">

    <div class="d-flex justify-content-between align-items-center flex-wrap">

        <div>

            <h1 class="display-6 fw-bold text-primary mb-1">

                ⚽ Soccer Calendar

            </h1>

            <p class="text-muted mb-0">

                世界中のサッカー日程をまとめて管理

            </p>

        </div>

        <div class="mt-3 mt-md-0">

            <button
                class="btn btn-outline-secondary me-2"
                title="通知">

                🔔

            </button>

            <button
                class="btn btn-outline-secondary"
                title="設定">

                ⚙

            </button>

        </div>

    </div>

</header>

<!-- ================================= -->
<!-- Favorite Teams -->
<!-- ================================= -->

<div class="card shadow-sm rounded-4 mb-4">

    <div class="card-header bg-warning-subtle">

        <h5 class="mb-0">

            ⭐ お気に入りチーム

        </h5>

    </div>

    <div class="card-body">

        <ul
            id="favorite-list"
            class="list-group list-group-flush">

            <li
                class="list-group-item text-muted text-center">

                まだお気に入りはありません。

            </li>

        </ul>

    </div>

</div>

<!-- ================================= -->
<!-- Weekly Matches -->
<!-- ================================= -->

<div class="card shadow-sm rounded-4 mb-4">

    <div class="card-header bg-success text-white">

        <h5 class="mb-0">
            📅 直近の試合
        </h5>

    </div>

    <div class="card-body">

        <button 
            id="back-favorites-btn"
            class="btn btn-outline-secondary mb-3"
            style="display:none;">

            ← お気に入り一覧に戻る

        </button>

        <div id="weekly-matches">

            <p class="text-muted text-center">
                読み込み中...
            </p>

        </div>

    </div>

</div>

<!-- ================================= -->
<!-- Match Search -->
<!-- ================================= -->

<div class="card shadow-sm rounded-4 mb-4">

    <div class="card-header bg-primary text-white">

        <h5 class="mb-0">

             ⭐ お気に入りチーム追加

        </h5>

    </div>

    <div class="card-body">

        <form method="POST">

            <!-- リーグ -->

            <div class="mb-3">

                <label class="form-label fw-bold">

                    リーグ

                </label>

                <select
                    class="form-select"
                    name="league">

                    {% for league in leagues %}

                    <option value="{{ league }}"
                    {% if league == selected_league %}selected{% endif %}>

                    {{ league }}

                    </option>

                    {% endfor %}

                </select>

            </div>

            <!-- チーム -->

            <div class="mb-4">

                <label class="form-label fw-bold">

                    チーム

                </label>

                <select
                    class="form-select"
                    name="team_id">

                </select>

            </div>

            <!-- ボタン -->

            <div class="d-grid gap-2">

                <button
                    type="button"
                    id="favorite-team-btn"
                    class="btn btn-warning">

                    ⭐ お気に入り登録

                </button>

            </div>

        </form>

    </div>

</div>

<script>
    window.allTeams = {{ all_teams | tojson }};
</script>

<script src="{{ url_for('static', filename='js/script.js') }}"></script>
